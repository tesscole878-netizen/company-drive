worker_processes 2;
events { worker_connections 4096; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    server {
        listen 8443 ssl;
        server_name 192.168.80.252;
        ssl_certificate /tls/portal.pem;
        ssl_certificate_key /tls/portal-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /dav { return 308 /dav/; }
        location ^~ /dav/ { proxy_pass http://127.0.0.1:8765; }
        location ^~ /s/ { proxy_pass http://127.0.0.1:8765; }
        location ^~ /public/ { proxy_pass http://127.0.0.1:8765; }
        location = /assets/share.js { proxy_pass http://127.0.0.1:8765; }

        location / {
            proxy_pass https://127.0.0.1:9443;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /tls/root.pem;
            proxy_ssl_name 192.168.80.252;
            proxy_ssl_server_name on;
        }
    }
}
