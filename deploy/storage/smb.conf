[global]
    server role = standalone server
    netbios name = SUYANSTORAGE
    workgroup = WORKGROUP
    smb ports = 445
    server min protocol = SMB3_00
    server smb encrypt = required
    server signing = mandatory
    disable netbios = yes
    map to guest = Never
    hosts allow = 192.168.70.82
    hosts deny = ALL
    passdb backend = tdbsam
    load printers = no
    disable spoolss = yes
    printing = bsd
    printcap name = /dev/null
    log level = 1
    logging = stdout

[SuyanCloudData]
    path = /srv/suyan-cloud-drive
    valid users = suyan_drive
    browseable = no
    guest ok = no
    read only = no
    create mask = 0600
    directory mask = 0700
    follow symlinks = no
